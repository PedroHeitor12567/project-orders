services:
  db:
    image: postgres:16-alpine
    container_name: project-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_orders
    ports:
      - "5433:5432"
    volumes:
      - project_orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  project_orders_db_data:
